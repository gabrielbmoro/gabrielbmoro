include: package:lints/recommended.yaml

analyzer:
  errors:
    avoid_relative_lib_imports: error
    always_use_package_imports: error
  exclude:
    - build/**
    - .dart_tool/**
    - .pub-cache/**
    - .dart-home/**
    - .mason-cache/**
    - tool/eagle_eye/**

linter:
  rules:
    - always_use_package_imports

formatter:
  page_width: 120
  trailing_commas: preserve
