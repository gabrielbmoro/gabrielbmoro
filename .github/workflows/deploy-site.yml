name: Deploy site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'tool/eagle_eye/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.5

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: dart analyze

      - name: Check architecture rules
        run: |
          dart pub get --directory tool/eagle_eye
          dart run --packages=tool/eagle_eye/.dart_tool/package_config.json tool/eagle_eye/bin/run.dart

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build site
        run: jaspr build --sitemap-domain https://gabrielbmoro.dev

      - name: Pin custom domain
        # upload-pages-artifact publishes the CNAME that ships inside the
        # artifact, so write it explicitly instead of relying on jaspr copying
        # web/ verbatim.
        run: printf '%s\n' 'gabrielbmoro.dev' > build/jaspr/CNAME

      - name: Trim build output
        # Jaspr leaves compiler caches and DDC package assets that the
        # pre-rendered site never references.
        run: rm -rf build/jaspr/packages build/jaspr/.dart_tool build/jaspr/.build.manifest

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/jaspr

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
